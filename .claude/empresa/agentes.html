<title>Empresa de Agentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera + objetivo; organigrama visual (izq) y canal de mensajes con quién dice qué (der) */
:root{--bg:#f3f4f7;--surface:#fff;--fg:#14171c;--muted:#5f6773;--line:#e2e5ea;--accent:#2f6df6;--ok:#1f8a4c;--bad:#c23b2e;--bubble:#eef2ff;
--display:"Sora",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--surface:#171a20;--fg:#e8ebf0;--muted:#9aa3af;--line:#272c35;--accent:#6a97ff;--ok:#4cc483;--bad:#ef6b5e;--bubble:#1d2436;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1014;--surface:#171a20;--fg:#e8ebf0;--muted:#9aa3af;--line:#272c35;--accent:#6a97ff;--ok:#4cc483;--bad:#ef6b5e;--bubble:#1d2436;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:20px 16px 48px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0}
h1{font-size:24px;font-weight:700}h2{font-size:14px;font-weight:600;letter-spacing:.02em}h3{font-size:14px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px}
.kpi b{font-family:var(--display);font-size:16px;margin-right:4px}
form{display:flex;gap:8px;flex-wrap:wrap}
textarea{flex:1 1 300px;min-height:52px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
button{font:600 15px var(--body);background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 20px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.main{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}

/* Organigrama */
.org{display:grid;gap:6px;justify-items:center}
.lvl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;width:100%}
.link{width:2px;height:18px;background:var(--line)}
.p{position:relative;width:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;transition:border-color .2s,box-shadow .2s}
.p.run{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.p.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.av{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font:600 15px var(--display);position:relative}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
.run .av::after{background:var(--accent);animation:pulse 1s infinite}
.ok .av::after{background:var(--ok)}
.err .av::after{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.run .av::after{animation:none}}
.nm{font-weight:600;font-size:14px;line-height:1.2}
.rl{font-size:12px;color:var(--muted);line-height:1.3}
.say{margin-top:6px;font-size:12px;background:var(--bubble);border-radius:10px;padding:5px 7px;text-align:left;max-height:3.9em;overflow:hidden;display:none}
.p.run .say,.p.ok .say{display:block}
.depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%}
.dept{border:1px dashed var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;justify-items:center;background:var(--bg)}
.dept h3{text-align:center}
.dept .p{width:100%}
.empty{padding:28px;text-align:center}

/* Canal */
.feed{display:grid;gap:12px;max-height:72vh;overflow:auto;padding-right:4px}
.m{display:grid;grid-template-columns:36px 1fr;gap:10px}
.m .av{width:36px;height:36px;font-size:13px;margin:0}.m .av::after{display:none}
.mh{font-size:13px}.mh b{font-size:14px}
.to{color:var(--muted)}
.mt{white-space:pre-wrap;font-size:14px;background:var(--bubble);border-radius:4px 12px 12px 12px;padding:8px 10px;margin-top:3px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--muted)}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>Empresa de Agentes</h1>
      <p class="muted" style="margin:2px 0 0">Tú → Lucía (tu compa) → Marcos (CEO) → departamentos. Cada mensaje es una llamada real a Claude.</p>
    </div>
    <div class="kpis">
      <div class="kpi"><b id="kAg">2</b>agentes</div>
      <div class="kpi"><b id="kDep">0</b>departamentos</div>
      <div class="kpi"><b id="kMsg">0</b>mensajes</div>
    </div>
  </div>

  <section class="card">
    <form id="f">
      <textarea id="goal" placeholder="Tu objetivo… p. ej. «Conseguir 100 € vendiendo mis libros PDF de fitness»" required></textarea>
      <button id="go">Encargar a Lucía</button>
    </form>
    <p id="note" class="muted" style="margin:6px 0 0"></p>
  </section>

  <div class="main">
    <section class="card">
      <h2 style="margin-bottom:12px">Organigrama</h2>
      <div class="org">
        <div class="lvl" id="lvlYou"></div><div class="link"></div>
        <div class="lvl" id="lvlCompa"></div><div class="link"></div>
        <div class="lvl" id="lvlCeo"></div><div class="link"></div>
        <div class="depts" id="depts"><div class="muted empty">El CEO creará aquí los departamentos.</div></div>
      </div>
    </section>
    <section class="card">
      <h2 style="margin-bottom:12px">Canal #empresa</h2>
      <div class="feed" id="feed"><div class="muted empty">Aún no hay conversación.</div></div>
    </section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hue = n => [...n].reduce((a, c) => a + c.charCodeAt(0), 0) * 47 % 360;
const ini = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const avatar = n => `<div class="av" style="background:hsl(${hue(n)} 55% 45%)">${esc(ini(n))}</div>`;
const now = () => new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });

const YOU = { nombre: "Tú", rol: "Fundador" };
const COMPA = { nombre: "Lucía Ferrer", rol: "Tu compa · asistente personal" };
const CEO = { nombre: "Marcos Vidal", rol: "CEO · Jefe de la empresa" };

let sample = null, msgs = 0, agents = 2;
claude.use("sample").then(s => {
  sample = s;
  if (!s) { $("#go").disabled = true; $("#note").textContent = "Esta vista no puede llamar a Claude. Ábrela en claude.ai."; }
});

function person(container, a) {
  const el = document.createElement("div");
  el.className = "p";
  el.innerHTML = `${avatar(a.nombre)}<div class="nm">${esc(a.nombre)}</div><div class="rl">${esc(a.rol)}</div><div class="say"></div>`;
  container.append(el);
  a.el = el;
  return a;
}
function state(a, s, text) {
  a.el.className = "p " + s;
  if (text != null) a.el.querySelector(".say").textContent = text;
}
// Mensaje en el canal: quién → a quién; el texto se actualiza mientras el agente escribe
function post(from, to, tag) {
  if (!msgs) $("#feed").innerHTML = "";
  $("#kMsg").textContent = ++msgs;
  const el = document.createElement("div");
  el.className = "m";
  el.innerHTML = `${avatar(from.nombre)}<div><div class="mh"><b>${esc(from.nombre)}</b> <span class="to">→ ${esc(to.nombre)} · ${now()}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</div><div class="mt">…</div></div>`;
  $("#feed").append(el);
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  const t = el.querySelector(".mt");
  return txt => { t.textContent = txt; };
}
// Un agente habla de verdad: estado en el organigrama + mensaje en el canal
async function talk(from, to, prompt, { tier = "default", tag } = {}) {
  state(from, "run", "escribiendo…");
  const write = post(from, to, tag);
  try {
    const r = await sample(prompt, { modelTier: tier, cache: false, onText: ({ text }) => { write(text); state(from, "run", text); } });
    write(r.text); state(from, "ok", r.text); return r.text;
  } catch (e) { state(from, "err", "no pudo responder"); write("⚠️ No pude responder (" + (e.code || "error") + ")"); throw e; }
}

function reset() {
  for (const id of ["#lvlYou", "#lvlCompa", "#lvlCeo"]) $(id).innerHTML = "";
  $("#depts").innerHTML = `<div class="muted empty">El CEO creará aquí los departamentos.</div>`;
  $("#feed").innerHTML = `<div class="muted empty">Aún no hay conversación.</div>`;
  msgs = 0; agents = 2;
  $("#kMsg").textContent = 0; $("#kDep").textContent = 0; $("#kAg").textContent = 2;
  person($("#lvlYou"), YOU); person($("#lvlCompa"), COMPA); person($("#lvlCeo"), CEO);
}
reset();

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const goal = $("#goal").value.trim();
  if (!goal || !sample) return;
  $("#go").disabled = true; reset();
  post(YOU, COMPA, "objetivo")(goal); state(YOU, "ok", goal);
  try {
    // 1. Lucía traslada el encargo al CEO
    const brief = await talk(COMPA, CEO, `Eres ${COMPA.nombre}, la asistente personal del fundador en una empresa de agentes. Traslada al CEO, ${CEO.nombre}, el objetivo del fundador como encargo claro: objetivo, resultado medible, restricciones y qué debe aprobar el fundador. Háblale en primera persona, en español, máximo 110 palabras.\n\nObjetivo del fundador: ${goal}`, { tier: "quick", tag: "encargo" });

    // 2. Marcos diseña la empresa
    state(CEO, "run", "Diseñando la organización…");
    const org = await sample.json(`Eres ${CEO.nombre}, CEO de una empresa de agentes de IA. Encargo de ${COMPA.nombre}:\n\n${brief}\n\nCrea la organización mínima necesaria: 2 a 4 departamentos. Cada uno con un responsable y 1-2 empleados más, todos con nombre y apellido españoles realistas y distintos, un cargo real y una tarea concreta y verificable. Devuelve SOLO JSON: {"anuncio":"mensaje del CEO al equipo explicando la estrategia y por qué crea estos departamentos, máx 80 palabras","departamentos":[{"nombre":"","mision":"","responsable":{"nombre":"","rol":"","tarea":""},"empleados":[{"nombre":"","rol":"","tarea":""}]}]}`, { modelTier: "default" });
    const deps = (org.departamentos || []).slice(0, 4);
    const TEAM = { nombre: "Todo el equipo", rol: "" };
    post(CEO, TEAM, "organización")(org.anuncio || "He creado la organización.");
    state(CEO, "ok", org.anuncio);

    $("#depts").innerHTML = "";
    $("#kDep").textContent = deps.length;
    for (const d of deps) {
      const box = document.createElement("div");
      box.className = "dept";
      box.innerHTML = `<div><h3>${esc(d.nombre)}</h3><div class="muted" style="text-align:center">${esc(d.mision)}</div></div>`;
      $("#depts").append(box);
      d.head = person(box, { ...d.responsable });
      d.staff = (d.empleados || []).slice(0, 2).map(x => person(box, { ...x }));
      agents += 1 + d.staff.length;
    }
    $("#kAg").textContent = agents;

    // 3. Cada departamento: el responsable reparte, los empleados entregan, el responsable informa al CEO
    const reports = await Promise.all(deps.map(async d => {
      const ctx = `Objetivo de la empresa: ${goal}. Estrategia del CEO: ${org.anuncio}. Departamento "${d.nombre}" (misión: ${d.mision}).`;
      await talk(d.head, { nombre: "su equipo" }, `Eres ${d.head.nombre}, ${d.head.rol}. ${ctx}\nTu equipo: ${d.staff.map(s => `${s.nombre} (${s.rol}): ${s.tarea}`).join("; ") || "ninguno"}.\nDa instrucciones breves y concretas a cada persona por su nombre. Máximo 70 palabras, en español.`, { tier: "quick", tag: d.nombre });
      const work = await Promise.all(d.staff.map(s => talk(s, d.head, `Eres ${s.nombre}, ${s.rol}. ${ctx}\nTu tarea: ${s.tarea}\nEntrega a tu responsable, ${d.head.nombre}, el trabajo YA HECHO (no un plan): concreto y accionable, máximo 160 palabras, en español. Marca [REQUIERE APROBACIÓN] cualquier gasto, publicación o acción externa.`, { tier: "quick", tag: "entrega" }).catch(() => `${s.nombre}: sin entrega`)));
      return talk(d.head, CEO, `Eres ${d.head.nombre}, ${d.head.rol}. ${ctx}\nTu propia tarea: ${d.head.tarea}\nEntregas de tu equipo:\n${work.join("\n\n")}\n\nInforma al CEO, ${CEO.nombre}: qué ha hecho tu departamento (incluye tu propia aportación hecha), qué falta y qué necesita aprobación. Máximo 130 palabras, en español.`, { tag: "informe" }).catch(() => `${d.nombre}: sin informe`);
    }));

    // 4. CEO revisa y responde a Lucía; 5. Lucía te informa
    const review = await talk(CEO, COMPA, `Eres ${CEO.nombre}, CEO. Revisa los informes de tus departamentos para el objetivo "${goal}" y responde a ${COMPA.nombre}: resultado, decisiones, qué debe aprobar el fundador y siguiente paso. Máximo 160 palabras, en español.\n\n${reports.join("\n\n")}`, { tag: "revisión" });
    await talk(COMPA, YOU, `Eres ${COMPA.nombre}, la compa del fundador. Cuéntale de tú, en español y en máximo 90 palabras, lo que te ha dicho ${CEO.nombre}: resultado, qué tiene que aprobar y siguiente paso.\n\nMensaje del CEO:\n${review}`, { tier: "quick", tag: "resumen" });
  } catch (err) {
    $("#note").textContent = err.code === "not_granted" ? "Sin permiso para llamar a Claude." : err.code === "rate_limited" ? "Límite alcanzado; prueba en un rato." : "Algo falló: " + (err.message || err);
  } finally { $("#go").disabled = !sample; }
});
</script>
