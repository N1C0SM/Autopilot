name: Deploy iOS (AltStore)

# Compila un .ipa SIN firmar. AltStore lo firma en el iPhone con el Apple ID
# gratuito del usuario, así que no hace falta la cuenta de Apple Developer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (producción)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Capacitor sync iOS
        run: npx cap sync ios
        env:
          CAP_DEV: "0"

      - name: Build app (sin firma)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios/App
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr autopilot.ipa Payload
          ls -lh autopilot.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-ios-ipa
          path: ios/App/autopilot.ipa
          retention-days: 30

      - name: Publish IPA to "ios-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || \
            gh release create ios-latest --title "Autopilot iOS (AltStore)" --notes "IPA sin firmar para AltStore / SideStore." --latest=false
          gh release upload ios-latest ios/App/autopilot.ipa --clobber
