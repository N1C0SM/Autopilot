name: Deploy Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web (producción, sin hot-reload)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Capacitor sync Android
        run: npx cap sync android
        env:
          CAP_DEV: "0"

      - name: Build installable APK
        run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to "android-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk autopilot.apk
          git tag -f android-latest && git push -f origin android-latest
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Autopilot Android (última versión)" --notes "APK instalable generado automáticamente." --latest=false
          gh release upload android-latest autopilot.apk --clobber

      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/autopilot-release.jks

      - name: Create keystore.properties
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          cat > android/keystore.properties << EOF
          storeFile=autopilot-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: ./gradlew bundleRelease
        working-directory: android

      - name: Upload AAB artifact
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Descomenta para subir automáticamente a Play Store (Internal track)
