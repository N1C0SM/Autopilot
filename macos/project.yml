# App de Autopilot para macOS. Genera el proyecto con: cd macos && xcodegen
name: AutopilotMac
options:
  bundleIdPrefix: app.autopilotplan
  deploymentTarget:
    macOS: "14.0"
targets:
  Autopilot:
    type: application
    platform: macOS
    sources: [Autopilot]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.autopilotplan.mac
        PRODUCT_NAME: Autopilot
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Autopilot
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Autopilot"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
