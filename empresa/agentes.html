<title>Empresa de Agentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--fg:#14171c;--muted:#5f6773;--line:#e2e5ea;--accent:#2f6df6;--ok:#1f8a4c;--bad:#c23b2e;
--display:"Sora",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--surface:#171a20;--fg:#e8ebf0;--muted:#9aa3af;--line:#272c35;--accent:#6a97ff;--ok:#4cc483;--bad:#ef6b5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--surface:#171a20;--fg:#e8ebf0;--muted:#9aa3af;--line:#272c35;--accent:#6a97ff;--ok:#4cc483;--bad:#ef6b5e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:24px 16px 48px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}
h1{font-size:26px}h2{font-size:15px}h3{font-size:14px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
form{display:flex;gap:8px;flex-wrap:wrap}
textarea{flex:1 1 300px;min-height:56px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
button{font:500 15px var(--body);background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.chain{display:grid;gap:10px}
.agent{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-size:20px}
.who{font-weight:500}.st{font-size:12px;color:var(--muted);margin-left:6px}
.st.run{color:var(--accent)}.st.ok{color:var(--ok)}.st.err{color:var(--bad)}
.msg{white-space:pre-wrap;font-size:14px;margin-top:2px}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dept{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.emp{border-top:1px solid var(--line);padding-top:8px}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.hidden{display:none}
</style>

<div class="wrap">
  <header>
    <h1>Empresa de Agentes</h1>
    <p class="muted">Tú → Compa → Jefe → departamentos con empleados → Jefe → Compa → tú.</p>
  </header>

  <section class="card">
    <form id="f">
      <textarea id="goal" placeholder="Escribe tu objetivo… (p. ej. «Conseguir 100 € vendiendo libros PDF de fitness»)" required></textarea>
      <button id="go">Encargar</button>
    </form>
    <p id="note" class="muted"></p>
  </section>

  <section class="card chain" id="chain"></section>

  <section class="card hidden" id="orgCard">
    <h2>Organización creada por el Jefe</h2>
    <p class="muted" style="margin:4px 0 12px">Cada empleado trabaja en su tarea de forma real (una llamada a Claude por empleado).</p>
    <div class="depts" id="depts"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sample = null;
claude.use("sample").then(s => {
  sample = s;
  if (!s) { $("#go").disabled = true; $("#note").textContent = "Esta vista no puede llamar a Claude. Ábrela en claude.ai."; }
});

function agentRow(icon, name) {
  const el = document.createElement("div");
  el.className = "agent";
  el.innerHTML = `<div class="av">${icon}</div><div><span class="who">${esc(name)}</span><span class="st run">pensando…</span><div class="msg"></div></div>`;
  $("#chain").append(el);
  return {
    text: t => el.querySelector(".msg").textContent = t,
    done: (ok = true, label) => { const s = el.querySelector(".st"); s.className = "st " + (ok ? "ok" : "err"); s.textContent = label || (ok ? "hecho" : "error"); }
  };
}

async function speak(row, prompt, tier = "default") {
  const r = await sample(prompt, { modelTier: tier, cache: false, onText: ({ text }) => row.text(text) });
  row.text(r.text); row.done(); return r.text;
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const goal = $("#goal").value.trim();
  if (!goal || !sample) return;
  $("#go").disabled = true; $("#chain").innerHTML = ""; $("#depts").innerHTML = ""; $("#orgCard").classList.add("hidden");
  const you = agentRow("🙂", "Tú"); you.text(goal); you.done(true, "objetivo");
  try {
    // 1. Compa convierte el objetivo en un encargo claro para el Jefe
    const compa = agentRow("🤝", "Compa");
    const brief = await speak(compa, `Eres "Compa", el asistente personal del fundador. El fundador te dice su objetivo y tú se lo trasladas al Jefe de la empresa como un encargo claro: objetivo, resultado esperado medible, restricciones y lo que el fundador debe aprobar. Responde en español, máximo 120 palabras, dirigiéndote al Jefe.\n\nObjetivo del fundador: ${goal}`, "quick");

    // 2. Jefe diseña la organización
    const jefe = agentRow("👔", "Jefe (CEO)");
    jefe.text("Diseñando departamentos y empleados…");
    const org = await sample.json(`Eres el Jefe (CEO) de una empresa de agentes de IA. Recibes este encargo de Compa:\n\n${brief}\n\nCrea la organización mínima necesaria: 2 a 4 departamentos, cada uno con 1 a 3 empleados (agentes) con una tarea concreta y verificable. Devuelve SOLO JSON: {"plan":"estrategia en 1-2 frases","departamentos":[{"nombre":"","mision":"","empleados":[{"nombre":"nombre propio","rol":"","tarea":""}]}]}. Todo en español.`, { modelTier: "default" });
    jefe.text(org.plan); jefe.done(true, "organización creada");

    // 3. Empleados trabajan en paralelo
    $("#orgCard").classList.remove("hidden");
    const jobs = [];
    for (const d of org.departamentos || []) {
      const box = document.createElement("div"); box.className = "dept";
      box.innerHTML = `<div><h3>${esc(d.nombre)}</h3><div class="muted">${esc(d.mision)}</div></div>`;
      $("#depts").append(box);
      for (const emp of d.empleados || []) {
        const el = document.createElement("div"); el.className = "emp";
        el.innerHTML = `<div><span class="who">${esc(emp.nombre)}</span> <span class="muted">· ${esc(emp.rol)}</span><span class="st run">trabajando…</span></div><div class="muted">${esc(emp.tarea)}</div><details><summary>Entrega</summary><div class="msg"></div></details>`;
        box.append(el);
        const out = el.querySelector(".msg"), st = el.querySelector(".st");
        jobs.push(sample(`Eres ${emp.nombre}, ${emp.rol} del departamento "${d.nombre}" (misión: ${d.mision}). Objetivo de la empresa: ${goal}. Plan del Jefe: ${org.plan}.\nTu tarea: ${emp.tarea}\nEntrega el trabajo hecho (no un plan de lo que harías): concreto, accionable, máximo 200 palabras, en español. Marca como [REQUIERE APROBACIÓN] cualquier gasto, publicación o acción externa.`,
          { modelTier: "quick", cache: false, onText: ({ text }) => out.textContent = text })
          .then(r => { out.textContent = r.text; st.className = "st ok"; st.textContent = "entregado"; return `${d.nombre} / ${emp.nombre} (${emp.rol}): ${r.text}`; })
          .catch(err => { st.className = "st err"; st.textContent = "falló"; return `${d.nombre} / ${emp.nombre}: no entregó (${err.code || "error"})`; }));
      }
    }
    const results = await Promise.all(jobs);

    // 4. Jefe revisa y 5. Compa informa
    const review = agentRow("👔", "Jefe (CEO) · revisión");
    const rep = await speak(review, `Eres el Jefe (CEO). Revisa las entregas de tus empleados para el objetivo "${goal}". Di qué está bien, qué falta y el siguiente paso. Máximo 180 palabras, en español.\n\n${results.join("\n\n")}`);
    const back = agentRow("🤝", "Compa → tú");
    await speak(back, `Eres "Compa". Resume al fundador, de tú y en español, el informe del Jefe en máximo 100 palabras: resultado, qué necesita aprobar él y siguiente paso.\n\nInforme del Jefe:\n${rep}`, "quick");
  } catch (err) {
    const r = agentRow("⚠️", "Sistema"); r.text(err.code === "not_granted" ? "Sin permiso para llamar a Claude." : err.code === "rate_limited" ? "Límite alcanzado; prueba en un rato." : "Algo falló: " + (err.message || err)); r.done(false);
  } finally { $("#go").disabled = !sample; }
});
</script>
