# App nativa de Autopilot (SwiftUI) para iPhone y Mac. Genera el proyecto con: cd native && xcodegen
name: Autopilot
options:
  bundleIdPrefix: app.autopilotplan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
settings:
  base:
    DEVELOPMENT_TEAM: 3245AGM98R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Autopilot
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Pantalla de arranque con la marca (no un negro vacío).
    INFOPLIST_KEY_UILaunchScreen: "{UIImageName = LaunchLogo; UIColorName = LaunchBackground; UIImageRespectsSafeAreaInsets = YES;}"
    INFOPLIST_KEY_NSCameraUsageDescription: "Para hacer las fotos de progreso y del escáner."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para elegir fotos de progreso y del escáner."
    INFOPLIST_KEY_NSHealthShareUsageDescription: "Para leer tu peso corporal y calibrar automáticamente tu progreso y requerimientos nutricionales."
    INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Para guardar tus entrenamientos y gasto calórico completados en Apple Salud."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Autopilot:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Autopilot
      - Shared
      # Atributos de la Live Activity del entreno: los mismos en la app y en la extensión (solo iOS, con #if os(iOS)).
      - path: AutopilotWidgets/WorkoutActivityAttributes.swift
    dependencies:
      - package: Supabase
      # Live Activity del entreno (pantalla de bloqueo e isla dinámica): solo iPhone, el Mac no la lleva.
      - target: AutopilotWidgets
        embed: true
        platformFilter: iOS
    settings:
      base:
        # Mismos identificadores que las apps que mostraban la web: la nativa las sustituye.
        PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]: app.lovable.aa0029da00154c05a2b503e61df0f87c
        PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]: app.lovable.aa0029da00154c05a2b503e61df0f87c
        PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]: app.autopilotplan.mac
        PRODUCT_NAME: Autopilot
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]: YES
        ENABLE_USER_SELECTED_FILES[sdk=macosx*]: readwrite
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Autopilot/App.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Autopilot/App.entitlements
        # El entreno en la pantalla de bloqueo y en la isla dinámica (ActivityKit, sin push).
        INFOPLIST_KEY_NSSupportsLiveActivities[sdk=iphoneos*]: YES
        INFOPLIST_KEY_NSSupportsLiveActivities[sdk=iphonesimulator*]: YES

  # Extensión de widgets del iPhone: pinta la Live Activity del entreno (WorkoutLiveActivity.swift)
  # con el AP (Shared/BrandShape.swift) y las fuentes de la app (Inter y Big Shoulders).
  AutopilotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AutopilotWidgets
      - path: Shared/BrandShape.swift
      - path: Shared/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lovable.aa0029da00154c05a2b503e61df0f87c.widgets
        PRODUCT_NAME: AutopilotWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AutopilotWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

# Esquema compartido generado por xcodegen: sin él, xcodebuild no encuentra «Autopilot»
# en una copia recién clonada (Xcode solo crea esquemas al abrir el proyecto a mano).
schemes:
  Autopilot:
    build:
      targets:
        Autopilot: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
