# App nativa de Autopilot (SwiftUI) para iPhone y Mac. Genera el proyecto con: cd native && xcodegen
name: Autopilot
options:
  bundleIdPrefix: app.autopilotplan
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
settings:
  base:
    DEVELOPMENT_TEAM: 3245AGM98R
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Autopilot
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # Pantalla de arranque con la marca (no un negro vacío).
    INFOPLIST_KEY_UILaunchScreen: "{UIImageName = LaunchLogo; UIColorName = LaunchBackground; UIImageRespectsSafeAreaInsets = YES;}"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_NSCameraUsageDescription: "Para hacer las fotos de progreso y del escáner."
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para elegir fotos de progreso y del escáner."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Autopilot:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Autopilot
      - Shared
    dependencies:
      - package: Supabase
      - target: AutopilotWidgets
        platformFilter: iOS
    settings:
      base:
        # Mismos identificadores que las apps que mostraban la web: la nativa las sustituye.
        PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]: app.lovable.aa0029da00154c05a2b503e61df0f87c
        PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]: app.lovable.aa0029da00154c05a2b503e61df0f87c
        PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]: app.autopilotplan.mac
        PRODUCT_NAME: Autopilot
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]: YES
        ENABLE_USER_SELECTED_FILES[sdk=macosx*]: readwrite
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Autopilot/App.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Autopilot/App.entitlements
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
  AutopilotWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lovable.aa0029da00154c05a2b503e61df0f87c.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
